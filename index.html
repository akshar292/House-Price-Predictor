<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI House Price Predictor</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial;
    background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);
}

.card{
    width:400px;
    padding:35px;
    border-radius:25px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 0 30px rgba(0,0,0,0.4);
    text-align:center;
}

h1{
    color:white;
    margin-bottom:10px;
    font-size:32px;
}

p{
    color:#cbd5e1;
    margin-bottom:25px;
}

.input-box{
    margin-bottom:18px;
}

input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,0.12);
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(135deg,#3b82f6,#06b6d4);
    color:white;
}

#result{
    margin-top:25px;
    color:#22c55e;
    font-size:24px;
    font-weight:bold;
}

.emoji{
    font-size:50px;
    margin-bottom:15px;
}

</style>

</head>
<body>

<div class="card">

<div class="emoji">🏡</div>

<h1>AI House Price Predictor</h1>

<p>Predict property prices instantly using AI</p>

<div class="input-box">
<input type="number" id="area" placeholder="Enter Area (sqft)">
</div>

<div class="input-box">
<input type="number" id="bedrooms" placeholder="Enter Bedrooms">
</div>

<div class="input-box">
<input type="number" id="age" placeholder="Enter House Age">
</div>

<button onclick="predictPrice()">
Predict Price 🚀
</button>

<div id="result"></div>

</div>

<script>

async function predictPrice(){

    const area = document.getElementById("area").value;
    const bedrooms = document.getElementById("bedrooms").value;
    const age = document.getElementById("age").value;

    if(area==="" || bedrooms==="" || age===""){
        document.getElementById("result").innerHTML =
        "⚠ Please fill all fields";
        return;
    }

    try{

        const response = await fetch(
            "/predict",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    area_sqft:parseFloat(area),
                    bedrooms:parseInt(bedrooms),
                    age_years:parseInt(age)
                })
            }
        );

        const data = await response.json();

        document.getElementById("result").innerHTML =
        "₹ " + data.predicted_price.toFixed(2);

    }

    catch(error){

        document.getElementById("result").innerHTML =
        "❌ Backend Error";
    }
}

</script>

</body>
</html>
